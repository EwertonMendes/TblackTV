name: Purge jsDelivr cache

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Purge and verify TizenBrew entry point
        shell: bash
        run: |
          set -euo pipefail

          repository="EwertonMendes/TblackTV"
          version="$(node -p "require('./package.json').version")"
          app_path="$(node -p "require('./package.json').appPath")"
          expected_entry_hash="$(sha256sum "${app_path}" | cut -d ' ' -f 1)"

          purge_file() {
            local file="$1"
            local response

            response="$(curl --fail --silent --show-error "https://purge.jsdelivr.net/gh/${repository}/${file}")"
            echo "${response}"
            if echo "${response}" | grep -q '"throttled":true'; then
              echo "Purge throttled for ${file}." >&2
              return 1
            fi
          }

          purge_file "package.json"
          purge_file "${app_path}"

          for attempt in 1 2 3 4 5; do
            remote_package="$(curl --fail --silent --show-error "https://cdn.jsdelivr.net/gh/${repository}/package.json?check=${GITHUB_SHA}-${attempt}")"
            remote_version="$(printf '%s' "${remote_package}" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(value).version));")"
            remote_app_path="$(printf '%s' "${remote_package}" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(value).appPath));")"

            if [ "${remote_version}" = "${version}" ] && [ "${remote_app_path}" = "${app_path}" ]; then
              remote_entry_hash="$(curl --fail --silent --show-error "https://cdn.jsdelivr.net/gh/${repository}/${app_path}?check=${GITHUB_SHA}" | sha256sum | cut -d ' ' -f 1)"
              [ "${remote_entry_hash}" = "${expected_entry_hash}" ]
              echo "Verified jsDelivr version ${version}, entry ${app_path}."
              exit 0
            fi

            sleep 8
          done

          echo "jsDelivr did not publish version ${version} and ${app_path} in time." >&2
          exit 1
