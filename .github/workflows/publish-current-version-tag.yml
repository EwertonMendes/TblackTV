name: Publish current TizenBrew version tag

on:
  push:
    branches:
      - master
    paths:
      - package.json
      - app/**
      - README.md
      - .github/workflows/publish-current-version-tag.yml

permissions:
  contents: write

jobs:
  publish-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish immutable version tag when missing
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing="$(git rev-list -n 1 "${tag}")"
            echo "${tag} already exists at ${existing}; immutable release tags are never moved."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
            git push origin "refs/tags/${tag}"
          fi

      - name: Verify immutable jsDelivr package
        shell: bash
        run: |
          set -euo pipefail

          repository="EwertonMendes/TblackTV"
          version="$(node -p "require('./package.json').version")"
          release="v${version}"
          release_commit="$(git rev-list -n 1 "${release}")"
          tagged_package="$(git show "${release}:package.json")"
          tagged_version="$(printf '%s' "${tagged_package}" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(value).version));")"
          app_path="$(printf '%s' "${tagged_package}" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(value).appPath));")"
          expected_hash="$(git show "${release}:${app_path}" | sha256sum | cut -d ' ' -f 1)"

          [ "${tagged_version}" = "${version}" ]

          for attempt in 1 2 3 4 5 6; do
            base_url="https://cdn.jsdelivr.net/gh/${repository}@${release}"
            remote_package="$(curl --fail --silent --show-error "${base_url}/package.json?check=${release_commit}-${attempt}")"
            remote_version="$(printf '%s' "${remote_package}" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(value).version));")"
            remote_app_path="$(printf '%s' "${remote_package}" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(value).appPath));")"

            if [ "${remote_version}" = "${tagged_version}" ] && [ "${remote_app_path}" = "${app_path}" ]; then
              remote_hash="$(curl --fail --silent --show-error "${base_url}/${app_path}?check=${release_commit}" | sha256sum | cut -d ' ' -f 1)"
              [ "${remote_hash}" = "${expected_hash}" ]
              echo "Verified ${repository}@${release}: ${tagged_version}, ${app_path}."
              exit 0
            fi

            sleep 10
          done

          echo "The immutable jsDelivr release did not become available in time." >&2
          exit 1
